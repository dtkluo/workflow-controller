plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.koljs.controller'
    compileSdk 34

    defaultConfig {
        applicationId "com.koljs.controller"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.0.6"
    }

    signingConfigs {
        release {
            // 签名材料一律从环境变量读取（CI 由 Actions secret 注入），仓库里不保存密钥。
            // 过去这里是 storeFile "keystore.jks" + 明文口令，等于把签名密钥公开出去 ——
            // 拿到它就能签出同签名同包名的 APK，伪装成升级包覆盖安装。
            // 本地构建前先导出：
            //   ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD /
            //   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
            def ksPath  = System.getenv("ANDROID_KEYSTORE_PATH")
            def ksPass  = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("ANDROID_KEY_ALIAS")
            def keyPass = System.getenv("ANDROID_KEY_PASSWORD")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            } else {
                logger.lifecycle("未提供 ANDROID_KEYSTORE_PATH：release 不签名（仅供本地检查）")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    testImplementation 'junit:junit:4.13.2'
}
