name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 先跑纯 JVM 单元测试再打包：SessionStateTest 覆盖「已结束会话不许发取消」与
      # 「网络抖动不得误判为已停止」两条核心防线，回归了就别往下走。
      # 用 testDebugUnitTest 而不是 test：AGP 的 test 是聚合任务，会把 debug 与
      # release 两个变体的单测各跑一遍（编译两遍、失败面翻倍），而这两个变体共用同一份
      # main 源码，跑 release 单测没有任何额外信息量。testDebugUnitTest 是 AGP 官方
      # 推荐的单变体写法，只编译纯 JVM 测试源，不触发 Android 打包链路。
      # 失败时 Gradle 会在控制台打印失败用例名与断言消息，无需额外上传报告。
      - name: 运行单元测试
        run: gradle :app:testDebugUnitTest --no-daemon

      # 密钥只存在于 Actions secret 中，运行时还原到临时目录，绝不写入工作区/仓库。
      # 之前这里是「不存在就生成一个并 git push」—— 那等于每次都可能把签名密钥提交到
      # 公开仓库，是必须铲掉的机制。
      - name: 注入签名密钥（来自 Secret，不落仓库）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64，无法签名发布"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "密钥库已还原：$(stat -c%s "$KS") 字节（位于 RUNNER_TEMP，不随工作区留存）"

      - name: 编译 Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      # 防止「静默产出未签名包」：构建脚本一旦拿不到密钥就会退化为不签名，
      # 这种 APK 装不上，必须在发布前就失败。
      - name: 校验签名
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: workflow-controller-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Workflow Controller v1.0.${{ github.run_number }}
          body: 云桌面遥控器：一键启停 GitHub Actions 虚拟机
          files: app/build/outputs/apk/release/app-release.apk
