name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 确保签名密钥存在（首次生成并提交，保证后续 APK 可升级安装）
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -storepass android -keypass android \
              -alias app -dname "CN=Workflow Controller" -keyalg RSA -keysize 2048 -validity 10000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore.jks
            git commit -m "chore: add release signing keystore"
            git push
          fi

      - name: 编译 Release APK
        run: gradle assembleRelease --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: workflow-controller-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Workflow Controller v1.0.${{ github.run_number }}
          body: 云桌面遥控器：一键启停 GitHub Actions 虚拟机
          files: app/build/outputs/apk/release/app-release.apk
